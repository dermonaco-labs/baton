name: Baton

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: baton-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baton:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validate handoffs
        run: node .baton/bin/baton.mjs validate --github
      - name: Diagnose installation
        if: always()
        run: node .baton/bin/baton.mjs doctor
