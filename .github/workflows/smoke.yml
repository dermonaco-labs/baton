name: Smoke

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Template instantiation
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          git init -q
          git add .github/workflows
          git -c user.name=t -c user.email=t@t commit -qm base
          BATON_FORCE_CLEANUP=1 node .baton/bin/baton.mjs adopt --no-workflows
          test ! -e src && test ! -e test && test ! -e specs/001-baton-template
          test ! -e package.json && test -d docs/baton
          test -f .github/workflows/baton.yml
          test -z "$(git status --porcelain -- .github/workflows)"
          if grep -q '# Baton Constitution' .specify/memory/constitution.md; then exit 1; fi
          node .baton/bin/baton.mjs doctor --strict
          node .baton/bin/baton.mjs validate
      - name: Overlay, handoff and update scenarios
        run: node --test test/integration/adopt.test.mjs test/integration/init.test.mjs test/integration/relay.test.mjs test/integration/update.test.mjs test/unit/models.test.mjs
  macos:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Template instantiation
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          git init -q
          git add .github/workflows
          git -c user.name=t -c user.email=t@t commit -qm base
          BATON_FORCE_CLEANUP=1 node .baton/bin/baton.mjs adopt --no-workflows
          test ! -e src && test ! -e test && test ! -e specs/001-baton-template
          test ! -e package.json && test -d docs/baton
          test -f .github/workflows/baton.yml
          test -z "$(git status --porcelain -- .github/workflows)"
          if grep -q '# Baton Constitution' .specify/memory/constitution.md; then exit 1; fi
          node .baton/bin/baton.mjs doctor --strict
          node .baton/bin/baton.mjs validate
      - name: Overlay, handoff and update scenarios
        run: node --test test/integration/adopt.test.mjs test/integration/init.test.mjs test/integration/relay.test.mjs test/integration/update.test.mjs test/unit/models.test.mjs
      - name: Reproduce pinned upstream only when inputs change
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD -- baton.lock.json packs/ baton/upstream/ .specify/ |
            grep -q .; then
            node .baton/bin/baton.mjs sync --check
          fi
  windows:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Template instantiation
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          git init -q
          git add .github/workflows
          git -c user.name=t -c user.email=t@t commit -qm base
          BATON_FORCE_CLEANUP=1 node .baton/bin/baton.mjs adopt --no-workflows
          test ! -e src && test ! -e test && test ! -e specs/001-baton-template
          test ! -e package.json && test -d docs/baton
          test -f .github/workflows/baton.yml
          test -z "$(git status --porcelain -- .github/workflows)"
          if grep -q '# Baton Constitution' .specify/memory/constitution.md; then exit 1; fi
          node .baton/bin/baton.mjs doctor --strict
          node .baton/bin/baton.mjs validate
      - name: Overlay, handoff and update scenarios
        run: node --test test/integration/adopt.test.mjs test/integration/init.test.mjs test/integration/relay.test.mjs test/integration/update.test.mjs test/unit/models.test.mjs
