name: CI

on:
  pull_request:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.5
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:md
      - run: npm run lint:yaml
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" -color
      - run: npm run typecheck
      - run: node .baton/bin/baton.mjs build --check
      - run: node .baton/bin/baton.mjs lock verify
      - run: node .baton/bin/baton.mjs validate --github
  test:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.5
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
