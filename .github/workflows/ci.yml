name: CI

on:
  pull_request:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.5
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:md
      - run: npm run lint:yaml
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" -color
      - run: npm run typecheck
      - run: node .baton/bin/baton.mjs build --check
      - run: node .baton/bin/baton.mjs sync --check
      - run: node .baton/bin/baton.mjs lock verify
      - run: node .baton/bin/baton.mjs validate --github
      - name: Check relative documentation links
        run: |
          curl -fSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" lychee-x86_64-unknown-linux-gnu/lychee
          "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" --offline --no-progress 'docs/**/*.md'
  test:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.5
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
