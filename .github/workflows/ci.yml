name: CI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:md
      - run: npm run lint:yaml
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" -color
      - run: npm run typecheck
      - run: node .baton/bin/baton.mjs build --check
      - run: node .baton/bin/baton.mjs lock verify
      - run: node .baton/bin/baton.mjs validate --github
      - uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: --offline --no-progress 'docs/**/*.md'
          fail: true
  test:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
