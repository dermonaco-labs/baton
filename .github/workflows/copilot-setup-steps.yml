name: Copilot setup steps

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pinned Spec Kit CLI when available
        shell: bash
        run: |
          if test -f baton/upstream/specify-cli.requirements.txt; then
            uv venv "$RUNNER_TEMP/baton-specify"
            uv pip install --python "$RUNNER_TEMP/baton-specify/bin/python" --require-hashes \
              -r baton/upstream/specify-cli.requirements.txt
            echo "$RUNNER_TEMP/baton-specify/bin" >> "$GITHUB_PATH"
          fi
      - name: Install project-defined dependencies when available
        shell: bash
        run: |
          if test -f package-lock.json; then
            npm ci --ignore-scripts --no-audit --no-fund
          fi
      - name: Diagnose the Baton installation
        run: node .baton/bin/baton.mjs doctor
