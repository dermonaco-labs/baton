name: Upstream watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
      - name: Verify pinned upstream snapshot
        id: sync
        shell: bash
        run: |
          if node .baton/bin/baton.mjs sync --check > "$RUNNER_TEMP/sync-check.log" 2>&1; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Check external documentation links
        id: links
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: --no-progress --include '^https?://' 'docs/**/*.md'
          output: lychee/out.md
          fail: false
          jobSummary: false
      - name: Update the single upstream tracking issue
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ steps.sync.outputs.result }}
          LINKS_RESULT: ${{ steps.links.outputs.exit_code }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const lock = JSON.parse(await readFile('baton.lock.json', 'utf8')).upstreams;
          const repo = 'dermonaco-labs/baton';
          const title = 'Upstream watch: releases and verification';
          const label = 'upstream-bump';
          const problems = [];
          const rows = [];
          const clean = value => String(value ?? '—').replaceAll('|', '\\|').replaceAll('\n', ' ');
          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...options.headers,
              },
            });
            if (!response.ok) throw new Error(`GitHub API ${path}: HTTP ${response.status}`);
            return response.json();
          };
          const json = async url => {
            const response = await fetch(url, { headers: { 'User-Agent': 'baton-upstream-watch' } });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response.json();
          };
          const probe = async (name, current, url, lookup, link) => {
            try {
              const latest = String(await lookup());
              if (latest !== String(current)) {
                rows.push(`| ${name} | ${clean(current)} | ${clean(latest)} | ${link(latest)} |`);
              }
            } catch (error) {
              problems.push(`- ${name} ([source](${url})): ${error.message}`);
            }
          };
          const release = async upstream => {
            const releases = await api(`/repos/${upstream.repo}/releases?per_page=20`);
            const latest = releases.find(item => !item.draft && !item.prerelease);
            if (!latest) throw new Error('No published stable release found');
            return latest.tag_name;
          };

          await probe('Spec Kit / PyPI specify-cli', lock.speckit.version,
            'https://pypi.org/project/specify-cli/',
            async () => (await json('https://pypi.org/pypi/specify-cli/json')).info.version,
            latest => `[PyPI](https://pypi.org/project/specify-cli/${encodeURIComponent(latest)}/)`);
          await probe('Spec Kit / GitHub release', lock.speckit.tag,
            `https://github.com/${lock.speckit.repo}/releases`,
            () => release(lock.speckit),
            latest => `[Release](https://github.com/${lock.speckit.repo}/releases/tag/${encodeURIComponent(latest)})`);
          await probe('ATV / npm atv-starterkit', lock.atv.version,
            'https://www.npmjs.com/package/atv-starterkit',
            async () => (await json('https://registry.npmjs.org/atv-starterkit/latest')).version,
            latest => `[npm](https://www.npmjs.com/package/atv-starterkit/v/${encodeURIComponent(latest)})`);
          await probe('ATV / main commit', lock.atv.commit,
            `https://github.com/${lock.atv.repo}/commits/main`,
            async () => (await api(`/repos/${lock.atv.repo}/commits/main`)).sha,
            latest => `[Compare](https://github.com/${lock.atv.repo}/compare/${lock.atv.commit}...${latest})`);
          await probe('ATV / GitHub release', lock.atv.version,
            `https://github.com/${lock.atv.repo}/releases`,
            () => release(lock.atv),
            latest => `[Release](https://github.com/${lock.atv.repo}/releases/tag/${encodeURIComponent(latest)})`);

          if (process.env.SYNC_RESULT !== 'pass') {
            const log = await readFile(`${process.env.RUNNER_TEMP}/sync-check.log`, 'utf8').catch(() => '');
            problems.push(`- \`baton sync --check\` failed (pin drift, unreachable commit or wheel hash):\n\n\`\`\`text\n${log.slice(-4000).replaceAll('```', "'''") || 'Step did not complete.'}\n\`\`\``);
          }
          if (process.env.LINKS_OUTCOME !== 'success' || process.env.LINKS_RESULT !== '0') {
            const report = await readFile('lychee/out.md', 'utf8').catch(() => '');
            problems.push(`- External documentation links failed:\n\n${report.slice(0, 6000) || `See the [workflow run](${process.env.RUN_URL}) for the link-check error.`}`);
          }

          const base = `/repos/${repo}`;
          let tracking;
          for (let page = 1; !tracking; page++) {
            const issues = await api(`${base}/issues?state=all&labels=${label}&per_page=100&page=${page}`);
            tracking = issues.find(issue => !issue.pull_request && issue.title === title);
            if (issues.length < 100) break;
          }
          if (!rows.length && !problems.length) {
            if (tracking?.state === 'open') {
              await api(`${base}/issues/${tracking.number}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  state: 'closed',
                  body: `All pinned upstreams and external documentation links verified. [Workflow run](${process.env.RUN_URL}).`,
                }),
              });
            }
          } else {
            const body = [
              'Automated weekly upstream watch. Maintainers review bumps locally; this workflow never pushes or opens PRs.',
              '',
              '| Source | Current pin | Latest | Changelog / comparison |',
              '| --- | --- | --- | --- |',
              ...rows,
              '',
              '## Verification and external links',
              ...(problems.length ? problems : ['- `baton sync --check` and external docs links passed.']),
              '',
              '## Maintainer commands',
              `- Spec Kit: \`node .baton/bin/baton.mjs sync --bump speckit=<PyPI version>\``,
              `- ATV: \`node .baton/bin/baton.mjs sync --bump atv=<main commit SHA>\``,
              '- Review the diff and run `node .baton/bin/baton.mjs sync --check` before committing.',
              '',
              `[Workflow run](${process.env.RUN_URL})`,
            ].join('\n');
            if (tracking) {
              await api(`${base}/issues/${tracking.number}`, {
                method: 'PATCH',
                body: JSON.stringify({ body, state: 'open' }),
              });
            } else {
              try {
                await api(`${base}/labels/${label}`);
              } catch (error) {
                if (!error.message.endsWith('HTTP 404')) throw error;
                await api(`${base}/labels`, {
                  method: 'POST',
                  body: JSON.stringify({ name: label, color: 'd4c5f9', description: 'Upstream release or pin update' }),
                });
              }
              await api(`${base}/issues`, {
                method: 'POST',
                body: JSON.stringify({ title, body, labels: [label] }),
              });
            }
          }
          if (process.env.SYNC_RESULT !== 'pass' || process.env.LINKS_OUTCOME !== 'success' || process.env.LINKS_RESULT !== '0') {
            process.exitCode = 1;
          }
          NODE
