name: Upstream watch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      preview:
        description: Detect, generate and validate only; write nothing but the step summary
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

# Trust boundary: detect reads only pinned upstream metadata and emits the trusted plan. generate runs
# the upstream generators and full checks with a read-only token; its artifacts are untrusted. publish
# and report check out the detected base and run only Node built-ins plus src/ maintainer modules,
# re-verifying every artifact against the plan; they never execute artifact content or build tooling.
jobs:
  detect:
    if: github.repository == 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      base: ${{ steps.plan.outputs.base }}
      publish: ${{ steps.plan.outputs.publish }}
      generate: ${{ steps.plan.outputs.generate }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          enable-cache: false
      - name: Verify pinned upstream snapshot
        id: sync
        shell: bash
        run: |
          if node .baton/bin/baton.mjs sync --check > "$RUNNER_TEMP/sync-check.log" 2>&1; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Check external documentation links
        id: links
        continue-on-error: true
        shell: bash
        run: |
          curl -fSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" lychee-x86_64-unknown-linux-gnu/lychee
          if "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" \
            --no-progress --include '^https?://' --format markdown \
            --output "$RUNNER_TEMP/lychee.out.md" 'docs/**/*.md'; then
            result=0
          else
            result=$?
          fi
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
      - name: Plan upstream candidates
        id: plan
        if: always() && steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
          SYNC_RESULT: ${{ steps.sync.outputs.result }}
          LINKS_RESULT: ${{ steps.links.outputs.exit_code }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
        run: |
          SYNC_LOG="$RUNNER_TEMP/sync-check.log" LINKS_REPORT="$RUNNER_TEMP/lychee.out.md" \
            node src/maintainer/upstream-upgrade.mjs detect

  generate:
    needs: detect
    if: github.repository == 'dermonaco-labs/baton' && (needs.detect.outputs.generate == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install uv
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.5
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate the candidate
        id: bump
        env:
          BUMP: ${{ matrix.bump }}
        run: |
          set -o pipefail
          node .baton/bin/baton.mjs sync --bump "$BUMP" 2>&1 | tee "$RUNNER_TEMP/bump.log"
      - name: Validate the candidate
        id: check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Package the candidate
        if: always() && steps.checkout.outcome == 'success'
        env:
          PLAN: ${{ needs.detect.outputs.plan }}
          UPSTREAM: ${{ matrix.upstream }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          BUMP_LOG="$RUNNER_TEMP/bump.log" CHECK_LOG="$RUNNER_TEMP/check.log" \
            CANDIDATE_DIR="$RUNNER_TEMP/candidate-$UPSTREAM" node src/maintainer/upstream-upgrade.mjs package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: candidate-${{ matrix.upstream }}
          path: ${{ runner.temp }}/candidate-${{ matrix.upstream }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, generate]
    if: github.repository == 'dermonaco-labs/baton' && (always() && needs.detect.result == 'success' && needs.detect.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      results: ${{ steps.publish.outputs.results }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.detect.outputs.generate == 'true'
        continue-on-error: true
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/artifacts
      - name: Publish draft candidates
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.detect.outputs.plan }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: node src/maintainer/upstream-upgrade.mjs publish

  report:
    needs: [detect, generate, publish]
    if: github.repository == 'dermonaco-labs/baton' && (always())
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.detect.outputs.generate == 'true'
        continue-on-error: true
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/artifacts
      - name: Update the single upstream tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.detect.outputs.plan }}
          RESULTS: ${{ needs.publish.outputs.results }}
          ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          PREVIEW: ${{ inputs.preview }}
          DETECT_RESULT: ${{ needs.detect.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node src/maintainer/upstream-upgrade.mjs report
