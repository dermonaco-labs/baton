name: Template cleanup

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: template-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository != 'dermonaco-labs/baton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - id: pending
        run: |
          if test -f .baton/template-cleanup-pending; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pending.outputs.present == 'true'
        with:
          node-version: '20'
      - name: Adopt template without changing workflows
        if: steps.pending.outputs.present == 'true'
        run: node .baton/bin/baton.mjs adopt --no-workflows
      - name: Commit adopter files
        if: steps.pending.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: personalize Baton template"
          if ! git push; then
            echo "::error::Template cleanup could not push. Run baton adopt locally and push the result."
            exit 1
          fi
      - name: Explain dormant workflows
        if: steps.pending.outputs.present == 'true'
        run: |
          echo "Baton template cleanup preserved workflow files. To remove dormant maintainer workflows, run baton adopt --prune-workflows locally." >> "$GITHUB_STEP_SUMMARY"
