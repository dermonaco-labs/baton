schema: 1
packs:
  - core
lanes:
  quick:
    max_files_changed: 10
gates:
  approver_roles:
    - repository owner
    - maintainer
    - reviewer
    - release manager
    - security lead
  approval_channels:
    - direct approval
    - control-plane delegation
    - pull request review
denylist:
  terms_file: null
models:
  roles:
    planning:
      model: claude-opus-5.5
      reasoning: high
    implementation:
      model: gpt-6-sol
      reasoning: high
    review:
      model: claude-opus-5.5
      reasoning: high
    fast:
      model: claude-haiku-4.5
  phase_roles: {}
  allowed: []
  enforce: warn
  apply_to_agents: false
checks:
  - name: baton
    run: npm run check
budgets:
  read_first_max: 12
  body_max_lines: 150
